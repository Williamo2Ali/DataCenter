[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2.6.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-os = "2"
tauri-plugin-device-contacts = { path = "../../tauri-plugin-device-contacts" }
tauri-plugin-file-share = { path = "../../tauri-plugin-file-share" }
tauri-plugin-file-copy = { path = "../../tauri-plugin-file-copy" }
pbkdf2 = "0.13.0"
aes-gcm = "0.11.1"
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
getrandom = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }
